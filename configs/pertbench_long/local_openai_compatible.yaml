config_version: "1.0"
mode: isolated_eval
agent: llm_adaptive_query
public_dir: data/episodes/synthetic_pilot_001/public
private_manifest: data/episodes/synthetic_pilot_001/private/manifest.json
output: runs/eval/local_model
model:
  backend: openai_compatible_chat
  base_url: http://127.0.0.1:8000/v1
  model: YOUR_SERVED_MODEL_NAME
  auth_mode: none
  api_key_env: null
  action_format: native_tools
  temperature: 0.0
  max_output_tokens_per_call: 2048
  token_parameter: max_tokens
  request_timeout_s: 120
  max_retries: 2
runtime:
  sandbox: docker
  analysis_image: YOUR_ANALYSIS_IMAGE_AT_FIXED_DIGEST
  isolation_attestation:
    digest: REPLACE_AFTER_RUNNING_ISOLATION_ACCEPTANCE
    accepted_by: null
    accepted_utc: null
    note: Copying a digest string is not acceptance. Run the commands in docs/pertbench_long/isolation.md against this same image first.
  episode_timeout_s: 1800
  tool_timeout_s: 60
  max_agent_steps: 60
  max_external_tool_calls: 80
  max_generation_tokens: 32000
  max_total_tokens: null
  context_policy: artifact_summaries_v1
  max_observation_chars: 24000
  cpu: 2
  memory_gib: 8
evaluation:
  experimental_budget_cap: 2
  seed: 0
  allow_unqualified: false
note: >
  Replace model and analysis_image. workspace_gib is omitted because it is not
  enforced; setting it would disqualify isolation. Live local eval is unverified
  until doctor-model, isolation acceptance, and a full episode succeed.
